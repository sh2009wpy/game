<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>数字轮换 puzzle</title>
    <script src="https://cdn.tailwindcss.com/3.3.3"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }
        .cell {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            transition: transform 0.3s ease;
            user-select: none;
            cursor: grab;
        }
        .game-board-4x4,
        .target-board-4x4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 8px;
            width: 320px;
            height: 320px;
            perspective: 1000px;
        }
        
        .game-board-6x6,
        .target-board-6x6 {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 6px;
            width: 450px;
            height: 450px;
            perspective: 1000px;
        }
        .cell.match {
            background: #facc15;
            animation: pulse 0.6s ease-in-out;
        }
        .selected {
            border: 2px solid #3b82f6;
            transform: scale(1.05) translateZ(10px);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.6);
            z-index: 10;
            position: relative;
        }
        .number-1 { background: #dbeafe; color: #1e40af; }
        .number-2 { background: #d1fae5; color: #047857; }
        .number-3 { background: #fef3c7; color: #92400e; }
        .number-4 { background: #ede9fe; color: #5b21b6; }
        .number-5 { background: #fee2e2; color: #dc2626; }
        .number-6 { background: #e0f2fe; color: #0c4a6e; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        @keyframes celebrate {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.1) rotate(5deg); }
            50% { transform: scale(1.2) rotate(-5deg); }
            75% { transform: scale(1.1) rotate(3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        
        .celebrate {
            animation: celebrate 0.8s ease-in-out;
        }
        
        .win-message {
            animation: bounce 1s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-6">
    <h1 class="text-3xl text-white mb-4 font-bold drop-shadow">数字轮换 Puzzle</h1>
    
    <!-- 难度选择 -->
    <div class="mb-4 flex gap-4">
        <button id="easy-btn" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors duration-200 font-bold">
            难度1
        </button>
        <button id="hard-btn" class="px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors duration-200 font-bold">
            难度2
        </button>
        <button id="expert-btn" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors duration-200 font-bold">
            难度3
        </button>
    </div>
    
    <div class="flex flex-col md:flex-row gap-8">
        <div>
            <div class="text-white mb-2 text-center">步数: <span id="steps-counter" class="font-bold text-yellow-300">0</span></div>
            <div id="game-grid" class="game-board-4x4 mb-4"></div>
        </div>
        <div>
            <div class="text-white mb-2 text-center">目标状态</div>
            <div id="target-grid" class="target-board-4x4"></div>
        </div>
    </div>
    <div id="message" class="text-white mt-2 text-xl font-bold"></div>
    
    <!-- 胜利弹窗 -->
    <div id="win-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg p-8 text-center max-w-sm mx-4">
            <h2 class="text-2xl font-bold text-green-600 mb-4">🎉 恭喜完成！</h2>
            <p class="text-lg text-gray-700 mb-2">你用了 <span id="final-steps" class="font-bold text-blue-600">0</span> 步完成了挑战！</p>
            <p class="text-sm text-gray-500 mb-6">太棒了！</p>
            <button id="modal-restart-btn" class="px-6 py-3 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors duration-200 shadow-lg font-bold">
                🎮 再玩一次
            </button>
        </div>
    </div>
    
    <button id="restart-btn" class="mt-4 px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors duration-200 shadow-lg hidden">
        🎮 再玩一次
    </button>

    <script>
        const grid = document.getElementById("game-grid");
        const targetGrid = document.getElementById("target-grid");
        const message = document.getElementById("message");
        let gameState = [], targetState = [];
        let dragStartX = null, dragStartY = null, dragRow = null, dragCol = null;
        let isAnimating = false;
        let lastMoveDistance = 0;
        let steps = 0;
        let currentDifficulty = 2; // 默认难度2
        const cellSize = 70;
        const gridGap = 8;
        let gridSize = 4; // 网格大小
        let maxNumber = 4; // 最大数字
        let unitDistance = cellSize + gridGap;

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        function initGame() {
            gameState = [], targetState = [];
            grid.innerHTML = "", targetGrid.innerHTML = "";
            
            // 根据难度设置网格大小和数字范围
            if (currentDifficulty === 3) {
                gridSize = 6;
                maxNumber = 6;
                grid.className = "game-board-6x6";
                targetGrid.className = "target-board-6x6";
            } else {
                gridSize = 4;
                maxNumber = 4;
                grid.className = "game-board-4x4";
                targetGrid.className = "target-board-4x4";
            }

            // 生成数字数组，确保每个数字数量相同
            let nums = [];
            const totalCells = gridSize * gridSize;
            const cellsPerNumber = totalCells / maxNumber;
            for (let i = 1; i <= maxNumber; i++) {
                for (let j = 0; j < cellsPerNumber; j++) {
                    nums.push(i);
                }
            }
            
            let gameNums = [...nums];
            shuffleArray(gameNums);

            // 根据难度设置目标状态
            if (currentDifficulty === 1) {
                // 难度1：固定目标状态
                targetState = [
                    [1, 2, 3, 4],
                    [2, 3, 4, 1],
                    [3, 4, 1, 2],
                    [4, 1, 2, 3]
                ];
            } else {
                // 难度2和3：随机目标状态
                let targetNums = [...nums];
                shuffleArray(targetNums);
                for (let r = 0; r < gridSize; r++) {
                    targetState[r] = [];
                    for (let c = 0; c < gridSize; c++) {
                        targetState[r][c] = targetNums[r * gridSize + c];
                    }
                }
            }

            // 生成游戏状态
            for (let r = 0; r < gridSize; r++) {
                gameState[r] = [];
                for (let c = 0; c < gridSize; c++) {
                    const v = gameNums[r * gridSize + c];
                    gameState[r][c] = v;
                    const cell = document.createElement("div");
                    cell.className = `cell number-${v}`;
                    cell.textContent = v;
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    grid.appendChild(cell);
                }
            }

            // 生成目标状态
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    const v = targetState[r][c];
                    const cell = document.createElement("div");
                    cell.className = `cell number-${v}`;
                    cell.textContent = v;
                    targetGrid.appendChild(cell);
                }
            }

            message.textContent = `难度${currentDifficulty}：拖动某行或列进行轮换`;
            steps = 0;
            document.getElementById("steps-counter").textContent = steps;
            checkWin();
        }

        function checkWin() {
            const cells = Array.from(grid.children);
            let win = true;
            cells.forEach((cell, i) => {
                const r = Math.floor(i / gridSize), c = i % gridSize;
                if (gameState[r][c] === targetState[r][c]) {
                    cell.classList.add("match");
                } else {
                    cell.classList.remove("match");
                    win = false;
                }
            });
            if (win) {
                // 添加庆祝动画
                cells.forEach(cell => {
                    cell.classList.add("celebrate");
                });
                
                // 显示胜利弹窗
                setTimeout(() => {
                    document.getElementById("final-steps").textContent = steps;
                    document.getElementById("win-modal").classList.remove("hidden");
                    
                    // 3秒后移除动画类
                    cells.forEach(cell => {
                        cell.classList.remove("celebrate");
                    });
                }, 1000);
            }
        }

        function moveRow(dir, steps, row) {
            isAnimating = true;
            const cells = Array.from(grid.children).filter(cell => parseInt(cell.dataset.row) === row);
            const data = [...gameState[row]];
            
            // 实现循环轮换：向右移动时最后一格移动到第一格，向左移动时第一格移动到最后一格
            for (let i = 0; i < steps; i++) {
                if (dir === "left") {
                    // 向左移动：第一格移动到最后一格
                    const first = data.shift();
                    data.push(first);
                } else {
                    // 向右移动：最后一格移动到第一格
                    const last = data.pop();
                    data.unshift(last);
                }
            }
            gameState[row] = data;

            cells.forEach((cell, i) => {
                const val = data[i];
                cell.textContent = val;
                cell.className = `cell number-${val}`;
                cell.style.transition = "none";
                cell.style.transform = "translateX(0)";
            });

            setTimeout(() => {
                isAnimating = false;
                checkWin();
            }, 50);
        }

        function moveCol(dir, steps, col) {
            isAnimating = true;
            let colData = [];
            for (let r = 0; r < gridSize; r++) colData.push(gameState[r][col]);
            for (let i = 0; i < steps; i++) {
                if (dir === "up") colData.push(colData.shift());
                else colData.unshift(colData.pop());
            }
            for (let r = 0; r < gridSize; r++) gameState[r][col] = colData[r];

            const cells = Array.from(grid.children).filter(cell => parseInt(cell.dataset.col) === col);
            cells.forEach((cell, i) => {
                const val = colData[i];
                cell.textContent = val;
                cell.className = `cell number-${val}`;
                cell.style.transition = "none";
                cell.style.transform = "translateY(0)";
            });

            setTimeout(() => {
                isAnimating = false;
                checkWin();
            }, 50);
        }

        grid.addEventListener("mousedown", (e) => {
            if (isAnimating) return;
            const cell = e.target.closest(".cell");
            if (!cell) return;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            dragRow = parseInt(cell.dataset.row);
            dragCol = parseInt(cell.dataset.col);
            
            // 添加选中效果
            const allCells = Array.from(grid.children);
            allCells.forEach(c => c.classList.remove("selected"));
            
            // 高亮当前行或列（根据初始点击位置）
            const rowCells = Array.from(grid.children).filter(c => parseInt(c.dataset.row) === dragRow);
            const colCells = Array.from(grid.children).filter(c => parseInt(c.dataset.col) === dragCol);
            
            // 初始时同时高亮行和列，拖动过程中根据方向调整
            rowCells.forEach(c => c.classList.add("selected"));
            colCells.forEach(c => c.classList.add("selected"));
        });

        grid.addEventListener("mousemove", (e) => {
            if (dragStartX === null || isAnimating) return;
            const dx = e.clientX - dragStartX;
            const dy = e.clientY - dragStartY;

            const distance = Math.max(Math.abs(dx), Math.abs(dy));
            const currentMoveDistance = Math.floor(distance / unitDistance);

            // 每超过0.5格就执行一次轮换
            if (currentMoveDistance > lastMoveDistance) {
                const moveSteps = currentMoveDistance - lastMoveDistance;
                lastMoveDistance = currentMoveDistance;
                
                // 增加步数
                if (moveSteps > 0) {
                    steps += moveSteps;
                    document.getElementById("steps-counter").textContent = steps;

                    if (Math.abs(dx) >= Math.abs(dy)) {
                        moveRow(dx > 0 ? "right" : "left", moveSteps, dragRow);
                    } else {
                        moveCol(dy > 0 ? "down" : "up", moveSteps, dragCol);
                    }
                }
            }

            // 根据拖动方向动态调整选中效果
            const allCells = Array.from(grid.children);
            allCells.forEach(c => c.classList.remove("selected"));
            
            // 显示拖动预览并更新选中效果
            if (Math.abs(dx) > Math.abs(dy)) {
                // 水平拖动，高亮整行
                const rowCells = Array.from(grid.children).filter(cell => parseInt(cell.dataset.row) === dragRow);
                rowCells.forEach(cell => {
                    cell.style.transition = "none";
                    cell.style.transform = `translateX(${dx % unitDistance}px)`;
                    cell.classList.add("selected");
                });
            } else {
                // 垂直拖动，高亮整列
                const colCells = Array.from(grid.children).filter(cell => parseInt(cell.dataset.col) === dragCol);
                colCells.forEach(cell => {
                    cell.style.transition = "none";
                    cell.style.transform = `translateY(${dy % unitDistance}px)`;
                    cell.classList.add("selected");
                });
            }
        });

        grid.addEventListener("mouseup", (e) => {
            if (dragStartX === null || isAnimating) return;
            
            // 清理拖动预览和选中效果
            const cells = Array.from(grid.children).filter(cell => 
                parseInt(cell.dataset.row) === dragRow || parseInt(cell.dataset.col) === dragCol
            );
            cells.forEach(cell => {
                cell.style.transition = "transform 0.2s ease";
                cell.style.transform = "translateX(0) translateY(0)";
                cell.classList.remove("selected");
            });

            lastMoveDistance = 0;
            dragStartX = dragStartY = dragRow = dragCol = null;
        });

        grid.addEventListener("mouseleave", () => {
            // 清理选中效果
            Array.from(grid.children).forEach(cell => {
                cell.classList.remove("selected");
            });
            dragStartX = dragStartY = dragRow = dragCol = null;
        });

        initGame();
        
        // 难度选择按钮事件
        document.getElementById("easy-btn").addEventListener("click", () => {
            currentDifficulty = 1;
            updateDifficultyButtons();
            initGame();
        });
        
        document.getElementById("hard-btn").addEventListener("click", () => {
            currentDifficulty = 2;
            updateDifficultyButtons();
            initGame();
        });
        
        document.getElementById("expert-btn").addEventListener("click", () => {
            currentDifficulty = 3;
            updateDifficultyButtons();
            initGame();
        });
        
        function updateDifficultyButtons() {
            // 重置所有按钮样式
            document.getElementById("easy-btn").className = "px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors duration-200 font-bold";
            document.getElementById("hard-btn").className = "px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors duration-200 font-bold";
            document.getElementById("expert-btn").className = "px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors duration-200 font-bold";
            
            // 高亮当前难度按钮
            if (currentDifficulty === 1) {
                document.getElementById("easy-btn").classList.add("bg-blue-600");
                document.getElementById("easy-btn").classList.remove("bg-blue-500");
            } else if (currentDifficulty === 2) {
                document.getElementById("hard-btn").classList.add("bg-purple-600");
                document.getElementById("hard-btn").classList.remove("bg-purple-500");
            } else if (currentDifficulty === 3) {
                document.getElementById("expert-btn").classList.add("bg-red-600");
                document.getElementById("expert-btn").classList.remove("bg-red-500");
            }
        }
        
        // 再玩一次按钮事件
        document.getElementById("restart-btn").addEventListener("click", () => {
            message.classList.remove("win-message");
            document.getElementById("restart-btn").classList.add("hidden");
            initGame();
        });
        
        // 弹窗中的再玩一次按钮事件
        document.getElementById("modal-restart-btn").addEventListener("click", () => {
            document.getElementById("win-modal").classList.add("hidden");
            initGame();
        });
        
        // 点击弹窗背景关闭弹窗
        document.getElementById("win-modal").addEventListener("click", (e) => {
            if (e.target === document.getElementById("win-modal")) {
                document.getElementById("win-modal").classList.add("hidden");
            }
        });
    </script>
</body>
</html>
